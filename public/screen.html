<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trendy – obrazovka</title>
<link rel="stylesheet" href="/fonts/wdth.css">
<style>
  :root {
    --ink: #07142B;
    --panel: #0D1F3D;
    --line: #1C3360;
    --paper: #F3F5EC;
    --muted: #8595B4;
    --dim: #2A4274;
    --font: 'Archivo Variable', 'Arial Narrow', Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: var(--font); color: var(--paper); font-variant-numeric: tabular-nums; cursor: none; }

  /* Pevné plátno, které se škáluje na jakýkoli LED panel. Rozměr lze změnit ?w=..&h=.. */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: var(--w); height: var(--h);
    transform-origin: 0 0;
    background: var(--ink);
    padding: 64px 80px 56px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 40px;
    overflow: hidden;
  }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 48px; }
  .title {
    font-size: 76px; line-height: .95; font-weight: 800; font-stretch: 78%;
    letter-spacing: -.01em; max-width: 1200px;
  }
  .status { text-align: right; white-space: nowrap; }
  .status .big { font-size: 88px; font-weight: 800; font-stretch: 112%; line-height: 1; }
  .status .small { font-size: 28px; color: var(--muted); font-stretch: 90%; margin-top: 6px; }
  .status .big.urgent { color: #FF7A6B; }

  main { min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; display: none; }
  .view.on { display: grid; }

  footer { display: flex; justify-content: space-between; align-items: center; font-size: 26px; color: var(--muted); font-stretch: 90%; min-height: 34px; }
  footer b { color: var(--paper); font-weight: 700; }

  /* ---------- Lobby ---------- */
  #lobby { grid-template-columns: 1fr 620px; gap: 96px; align-items: center; }
  .lead { font-size: 40px; line-height: 1.25; font-stretch: 92%; color: #C9D2E3; max-width: 900px; }
  .steps { list-style: none; margin-top: 56px; display: grid; gap: 28px; counter-reset: s; }
  .steps li { display: grid; grid-template-columns: 72px 1fr; align-items: baseline; font-size: 44px; font-weight: 600; font-stretch: 88%; counter-increment: s; }
  .steps li::before { content: counter(s); font-size: 44px; font-weight: 800; font-stretch: 120%; color: var(--muted); }
  .trendstrip { margin-top: 64px; display: flex; flex-wrap: wrap; gap: 14px 30px; font-size: 26px; font-stretch: 85%; color: #B4C0D6; max-width: 1000px; }
  .trendstrip span { display: inline-flex; align-items: center; gap: 10px; }
  .trendstrip i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }

  .qrcard { background: var(--paper); color: var(--ink); border-radius: 28px; padding: 36px; text-align: center; }
  .qrcard img { width: 100%; display: block; image-rendering: pixelated; }
  .qrcard .url { font-size: 34px; font-weight: 700; font-stretch: 86%; margin-top: 20px; word-break: break-all; line-height: 1.1; }
  .qrcard .joined { font-size: 30px; margin-top: 10px; font-stretch: 92%; color: #33466B; }

  /* ---------- Voting ---------- */
  #voting { grid-template-columns: 1fr 440px; gap: 72px; }
  .side { display: grid; grid-template-rows: auto auto 1fr; gap: 30px; min-height: 0; }
  .side .qrcard { padding: 18px; border-radius: 20px; width: 300px; }
  .side .qrcard .url { font-size: 22px; margin-top: 10px; }
  .tally { display: grid; gap: 4px; }
  .tally .n { font-size: 104px; line-height: .9; font-weight: 800; font-stretch: 115%; }
  .tally .l { font-size: 28px; color: var(--muted); font-stretch: 90%; }
  .ticker { list-style: none; overflow: hidden; display: flex; flex-direction: column; gap: 12px; min-height: 0;
            mask-image: linear-gradient(#000 60%, transparent); }
  .ticker li { flex-shrink: 0; line-height: 1.2; font-size: 28px; font-stretch: 88%; color: #B7C3D9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ticker li.new b { color: #FFFFFF; }
  .ticker li b { color: var(--paper); font-weight: 700; }
  @keyframes tick { from { opacity: 0; transform: translateY(-12px); } }

  .pool { display: grid; grid-template-rows: auto 1fr; gap: 28px; min-height: 0; }
  .pool h2 { font-size: 40px; font-weight: 700; font-stretch: 88%; }
  .pool h2 small { display: block; font-size: 28px; font-weight: 400; color: var(--muted); margin-top: 6px; }
  .dots { display: grid; gap: 10px; align-content: start; min-height: 0; }
  .dots i { aspect-ratio: 1; border-radius: 50%; background: var(--dim); transition: background .6s, transform .6s; }
  .dots i.v { background: var(--paper); transform: scale(1.08); }

  /* ---------- Bars (live + results) ---------- */
  .bars { position: relative; height: 100%; }
  .row {
    position: absolute; left: 0; right: 0; height: calc(100% / 10);
    display: grid; grid-template-columns: 64px var(--nmw, 680px) 1fr 150px 190px; align-items: center; gap: 24px;
    transition: transform .9s cubic-bezier(.2,.8,.2,1), opacity .6s;
  }
  .row .rk { font-size: 36px; font-weight: 800; font-stretch: 120%; color: var(--muted); text-align: right; }
  .row .nm { font-size: var(--nmSize, 44px); font-weight: 700; font-stretch: 72%; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .track { height: 62%; position: relative; }
  .row .fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: repeating-linear-gradient(90deg, var(--c) 0 calc(var(--cell) - 5px), transparent calc(var(--cell) - 5px) var(--cell));
    transition: width 1.1s cubic-bezier(.2,.8,.2,1);
  }
  .row .tok { font-size: 24px; color: var(--muted); font-stretch: 90%; text-align: right; white-space: nowrap; }
  .row .pct { font-size: 52px; font-weight: 800; font-stretch: 108%; text-align: right; line-height: 1; white-space: nowrap; }
  #liveBars .row { grid-template-columns: 52px var(--nmw, 460px) 1fr 170px; }
  #liveBars .row .tok { display: none; }
  #liveBars .row .nm { font-size: var(--nmSize, 38px); }
  #liveBars .row .pct { font-size: 44px; }
  .bars.hidden-reveal .row { opacity: 0; }
  .bars .row.shown { opacity: 1; }

  #results { grid-template-rows: 1fr; }

  /* ---------- Winners ---------- */
  #winners { grid-template-columns: 1.25fr 1fr; gap: 96px; align-items: stretch; }
  .podium { display: grid; grid-template-rows: auto repeat(3, 1fr); gap: 20px; }
  .podium .p {
    display: grid; grid-template-columns: 120px 1fr auto; align-items: center; gap: 32px;
    border-top: 3px solid var(--line); padding-top: 12px;
    opacity: 0; transform: translateY(20px); transition: opacity .7s, transform .7s;
  }
  .podium .p.shown { opacity: 1; transform: none; }
  .podium .p .place { font-size: 110px; font-weight: 800; font-stretch: 125%; line-height: 1; color: var(--muted); }
  .podium .p.first { border-top-color: var(--paper); }
  .podium .p.first .place { color: var(--paper); }
  .podium .p .who { font-size: 76px; font-weight: 800; font-stretch: 78%; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .podium .p.first .who { font-size: 104px; }
  .podium .p .sc { font-size: 56px; font-weight: 700; font-stretch: 105%; }
  .podium .p .sc small { display: block; font-size: 22px; color: var(--muted); font-weight: 400; text-align: right; }
  .runners { list-style: none; display: grid; align-content: start; gap: 6px; }
  .runners h3 { font-size: 32px; font-weight: 600; color: var(--muted); font-stretch: 90%; margin-bottom: 18px; }
  .runners li { display: grid; grid-template-columns: 70px 1fr auto; font-size: 42px; font-stretch: 84%; padding: 12px 0; border-bottom: 2px solid var(--line);
                opacity: 0; transition: opacity .5s; }
  .runners li.shown { opacity: 1; }
  .runners li span:first-child { color: var(--muted); font-weight: 700; }
  .runners li span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 20px; }
  .runners .avg { margin-top: 36px; font-size: 28px; color: var(--muted); font-stretch: 90%; }

  #closed { place-items: center; text-align: center; }
  #closed .n { font-size: 220px; font-weight: 800; font-stretch: 120%; line-height: 1; }
  #closed .l { font-size: 44px; color: var(--muted); font-stretch: 90%; }

  #confetti { position: absolute; inset: 0; pointer-events: none; }
  .offline { position: absolute; right: 24px; bottom: 16px; font-size: 20px; color: #FF7A6B; display: none; }
  #badge {
    position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: rgba(243,245,236,.92); color: var(--ink); font-size: 26px; font-weight: 700; font-stretch: 90%;
    padding: 12px 26px; border-radius: 14px; opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  #badge.on { opacity: 1; }
  .offline.on { display: block; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01s !important; animation-duration: .01s !important; }
  }
</style>
</head>
<body>
<div id="stage">
  <header>
    <h1 class="title" id="title"></h1>
    <div class="status"><div class="big" id="sBig"></div><div class="small" id="sSmall"></div></div>
  </header>

  <main>
    <section class="view" id="lobby">
      <div>
        <p class="lead" id="lead"></p>
        <ol class="steps">
          <li><span>Naskenuj QR kód telefonem</span></li>
          <li><span>Zvol si přezdívku</span></li>
          <li><span>Rozděl <span id="tokN"></span> tokenů mezi nejvýše <span id="maxN"></span> trendů</span></li>
        </ol>
        <div class="trendstrip" id="strip"></div>
      </div>
      <div class="qrcard">
        <img class="qr" alt="QR kód pro vstup do hry">
        <div class="url joinurl"></div>
      </div>
    </section>

    <section class="view" id="voting">
      <div class="pool" id="blindPool">
        <h2>Tipy přibývají<small>Rozložení zůstane skryté až do konce hlasování.</small></h2>
        <div class="dots" id="dots"></div>
      </div>
      <div class="bars" id="liveBars" style="display:none"></div>
      <aside class="side">
        <div class="qrcard"><img class="qr" alt="QR kód"><div class="url joinurl"></div></div>
        <div class="tally"><div class="n" id="votedN">0</div><div class="l" id="votedL"></div></div>
        <ul class="ticker" id="ticker"></ul>
      </aside>
    </section>

    <section class="view" id="closed">
      <div><div class="n" id="closedN"></div><div class="l">tipů odevzdáno. Hlasování je uzavřené.</div></div>
    </section>

    <section class="view" id="results"><div class="bars" id="resBars"></div></section>

    <section class="view" id="winners">
      <div class="podium" id="podium"></div>
      <ol class="runners" id="runners"></ol>
    </section>
  </main>

  <footer><span id="foot"></span><span id="footR"></span></footer>
  <canvas id="confetti"></canvas>
  <div class="offline" id="offline">Spojení se serverem ztraceno, obnovuji…</div>
  <div id="badge"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(async () => {
  const qs = new URLSearchParams(location.search);
  const W = +qs.get('w') || 1920, H = +qs.get('h') || 1080;
  const stage = document.getElementById('stage');
  stage.style.setProperty('--w', W + 'px'); stage.style.setProperty('--h', H + 'px');
  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = `translate(${-W * s / 2}px, ${-H * s / 2}px) scale(${s})`;
    fitNames($('resBars'), 44); fitNames($('liveBars'), 38);
    layoutBars();
  }
  addEventListener('resize', fit);

  const cfg = await (await fetch('/api/config')).json();
  const $ = id => document.getElementById(id);
  const fmt = n => n.toLocaleString('cs-CZ');
  const pct = n => n.toLocaleString('cs-CZ', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' %';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  $('title').textContent = cfg.title;
  $('lead').textContent = cfg.subtitle;
  $('tokN').textContent = cfg.TOKENS;
  $('maxN').textContent = cfg.MAX_TRENDS;
  $('strip').innerHTML = cfg.trends.map(t => `<span><i style="background:${t.color}"></i>${esc(t.name)}</span>`).join('');
  document.querySelectorAll('.qr').forEach(i => i.src = '/qr.svg?' + Date.now());
  document.querySelectorAll('.joinurl').forEach(e => e.textContent = cfg.joinUrl.replace(/^https?:\/\//, ''));

  // ---------- bar chart ----------
  function buildBars(el) {
    el.innerHTML = cfg.trends.map(t => `
      <div class="row" data-id="${t.id}" style="--c:${t.color}">
        <div class="rk"></div><div class="nm">${esc(t.name)}</div>
        <div class="track"><div class="fill"></div></div>
        <div class="tok"></div><div class="pct">0 %</div>
      </div>`).join('');
  }
  buildBars($('liveBars')); buildBars($('resBars'));

  // Názvy trendů se zmenší jen tak, aby se ty nejdelší vešly bez zkrácení třemi tečkami.
  function fitNames(el, max) {
    let size = max;
    el.style.setProperty('--nmSize', size + 'px');
    const over = () => [...el.querySelectorAll('.nm')].some(n => n.scrollWidth > n.clientWidth + 1);
    while (size > 26 && over()) { size -= 2; el.style.setProperty('--nmSize', size + 'px'); }
  }

  let lastBarData = { live: null, res: null };
  function renderBars(el, crowdPct, totals, key) {
    lastBarData[key] = { crowdPct, totals };
    const sorted = [...cfg.trends].sort((a, b) => (crowdPct[b.id] - crowdPct[a.id]) || a.name.localeCompare(b.name));
    const max = Math.max(10, ...Object.values(crowdPct));
    const scale = Math.ceil(max / 5) * 5; // osa v celých 5 %
    const rows = el.querySelectorAll('.row');
    const trackW = rows[0].querySelector('.track').getBoundingClientRect().width / currentScale();
    // 1 dílek = 1, 2 nebo 5 procentních bodů – podle toho, co je na LED ještě čitelné
    const unit = [1, 2, 5, 10].find(u => trackW / scale * u >= 28) || 10;
    const cell = trackW / scale * unit;
    sorted.forEach((t, i) => {
      const r = el.querySelector(`[data-id="${t.id}"]`);
      r.style.transform = `translateY(${i * 100}%)`;
      r.style.setProperty('--cell', cell + 'px');
      r.querySelector('.rk').textContent = i + 1;
      r.querySelector('.fill').style.width = (crowdPct[t.id] / scale * 100) + '%';
      r.querySelector('.pct').textContent = pct(crowdPct[t.id]);
      r.querySelector('.tok').textContent = fmt(totals[t.id]) + ' tokenů';
      r.dataset.rank = i;
    });
  }
  function currentScale() { const m = stage.style.transform.match(/scale\(([\d.]+)\)/); return m ? +m[1] : 1; }
  function layoutBars() {
    if (lastBarData.live) renderBars($('liveBars'), lastBarData.live.crowdPct, lastBarData.live.totals, 'live');
    if (lastBarData.res) renderBars($('resBars'), lastBarData.res.crowdPct, lastBarData.res.totals, 'res');
  }

  // ---------- reveal choreography ----------
  let revealedResults = false, revealedWinners = false, revealTimers = [];
  function clearReveal() { revealTimers.forEach(clearTimeout); revealTimers = []; }

  function revealResults(s) {
    const el = $('resBars');
    const zero = Object.fromEntries(cfg.trends.map(t => [t.id, 0]));
    el.classList.add('hidden-reveal');
    el.querySelectorAll('.row').forEach(r => r.classList.remove('shown'));
    renderBars(el, s.crowdPct, s.totals, 'res');
    // nejdřív vynulovat šířky, pak odhalovat od 10. místa k 1.
    el.querySelectorAll('.fill').forEach(f => { f.style.transition = 'none'; f.style.width = '0'; });
    const order = [...el.querySelectorAll('.row')].sort((a, b) => b.dataset.rank - a.dataset.rank);
    const scale = Math.ceil(Math.max(10, ...Object.values(s.crowdPct)) / 5) * 5;
    order.forEach((r, i) => {
      // místa 10–4 rychle za sebou, první tři s pauzou na napětí
      const delay = i < 7 ? 600 + i * 900 : 600 + 6 * 900 + (i - 6) * 2600;
      revealTimers.push(setTimeout(() => {
        r.classList.add('shown');
        const f = r.querySelector('.fill');
        f.style.transition = '';
        requestAnimationFrame(() => { f.style.width = (s.crowdPct[r.dataset.id] / scale * 100) + '%'; });
      }, delay));
    });
  }

  function revealWinners(s) {
    const w = s.winners || [];
    const top = w.slice(0, 3);
    $('podium').innerHTML = '<div></div>' + top.map((r, i) => `
      <div class="p ${i === 0 ? 'first' : ''}" data-i="${i}">
        <div class="place">${r.rank}</div>
        <div class="who">${esc(r.nick)}</div>
        <div class="sc">${pct(r.score)}<small>shoda</small></div>
      </div>`).join('');
    $('runners').innerHTML = `<h3>Další v pořadí</h3>` + w.slice(3).map(r => `
      <li><span>${r.rank}.</span><span>${esc(r.nick)}</span><span>${pct(r.score)}</span></li>`).join('') +
      (s.avgScore != null ? `<div class="avg">Průměrná shoda sálu: ${pct(s.avgScore)}</div>` : '');
    const lis = [...$('runners').querySelectorAll('li')].reverse();
    lis.forEach((li, i) => revealTimers.push(setTimeout(() => li.classList.add('shown'), 400 + i * 350)));
    const base = 600 + lis.length * 350;
    const ps = [...$('podium').querySelectorAll('.p')].reverse();
    ps.forEach((p, i) => revealTimers.push(setTimeout(() => {
      p.classList.add('shown');
      if (p.classList.contains('first')) confetti();
    }, base + 600 + i * 2200)));
  }

  // ---------- confetti ----------
  function confetti() {
    const cv = $('confetti'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cols = cfg.trends.map(t => t.color);
    const parts = Array.from({ length: 260 }, () => ({
      x: Math.random() * W, y: -Math.random() * H * .6, vx: (Math.random() - .5) * 4, vy: 3 + Math.random() * 5,
      s: 10 + Math.random() * 14, r: Math.random() * 6, vr: (Math.random() - .5) * .2, c: cols[Math.random() * cols.length | 0],
    }));
    const t0 = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, W, H);
      parts.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
      });
      if (t - t0 < 7000) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
    })(t0);
  }

  // ---------- ovládání prezentační klikačkou ----------
  // Zapne se tím, že se obrazovka otevře s administrátorským klíčem: /screen#key=<ADMIN_KEY>
  // Klikačky posílají stejné klávesy jako prezentace, takže okno hry se chová jako další slidy.
  const presenterKey = new URLSearchParams(location.hash.slice(1)).get('key') || qs.get('key') || '';
  const PHASE_ORDER = ['lobby', 'voting', 'closed', 'results', 'winners'];
  const PHASE_NAME = { lobby: 'Lobby s QR kódem', voting: 'Hlasování spuštěno', closed: 'Hlasování uzavřeno', results: 'Výsledky sálu', winners: 'Vyhlášení vítězů' };
  let presenter = false, busy = false;

  let badgeTimer;
  function badge(text, ms = 2600) {
    $('badge').textContent = text;
    $('badge').classList.add('on');
    clearTimeout(badgeTimer);
    badgeTimer = setTimeout(() => $('badge').classList.remove('on'), ms);
  }

  function step(dir) {
    if (!presenter || !S || busy) return;
    const i = PHASE_ORDER.indexOf(S.phase);
    const next = PHASE_ORDER[i + dir];
    if (!next) return badge(dir > 0 ? 'Tohle je poslední fáze' : 'Tohle je první fáze');
    // Zpět do hlasování se z uzavřené hry vrátit nedá, aby klik omylem neodmrazil pořadí.
    if (dir < 0 && next === 'voting') return badge('Znovu otevřít hlasování jde jen v administraci');
    busy = true;
    socket.emit('admin:phase', { phase: next, minutes: next === 'voting' ? (cfg.VOTING_MINUTES ?? 0) : 0 }, r => {
      busy = false;
      badge(r && r.error ? r.error : PHASE_NAME[next]);
    });
  }

  addEventListener('keydown', e => {
    if (!presenter) return;
    if (['ArrowRight', 'PageDown', ' ', 'Enter', 'ArrowDown'].includes(e.key)) { e.preventDefault(); step(1); }
    else if (['ArrowLeft', 'PageUp', 'ArrowUp'].includes(e.key)) { e.preventDefault(); step(-1); }
  });

  // ---------- state ----------
  let S = null, clockOffset = 0;
  const socket = io({ transports: ['websocket', 'polling'] });
  socket.on('connect', () => {
    $('offline').classList.remove('on');
    socket.emit('screen:hello');
    if (presenterKey) socket.emit('admin:hello', { key: presenterKey, silent: true }, r => {
      presenter = !(r && r.error);
      badge(presenter ? 'Ovládání klikačkou zapnuto' : 'Neplatný klíč, ovládání klikačkou nefunguje', presenter ? 4000 : 8000);
      if (presenter) history.replaceState(null, '', location.pathname);
    });
  });
  socket.on('disconnect', () => $('offline').classList.add('on'));

  socket.on('screen:state', s => {
    const prev = S; S = s;
    clockOffset = s.serverNow - Date.now();
    // Během hlasování může obrazovka zůstat u lobby s QR kódem, aby se mohli přidávat opozdilci.
    const qrDuringVoting = s.phase === 'voting' && !s.crowdPct && cfg.VOTING_VIEW !== 'stats';
    const view = qrDuringVoting ? 'lobby' : s.phase;
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === view));

    if (s.phase !== 'results') revealedResults = false;
    if (s.phase !== 'winners') revealedWinners = false;
    if (!prev || prev.phase !== s.phase) clearReveal();

    $('foot').innerHTML = s.phase === 'voting'
      ? `Připojeno <b>${fmt(s.joined)}</b> ${plural(s.joined, 'hráč', 'hráči', 'hráčů')}, odevzdaných tipů <b>${fmt(s.voted)}</b>`
      : '';
    $('footR').textContent = s.phase === 'voting' ? `${fmt(s.tokensInPlay)} tokenů ve hře` : '';


    if (s.phase === 'voting' && !qrDuringVoting) {
      const live = !!s.crowdPct;
      $('blindPool').style.display = live ? 'none' : '';
      $('liveBars').style.display = live ? '' : 'none';
      if (live) renderBars($('liveBars'), s.crowdPct, s.totals, 'live');
      else renderDots(s);
      $('votedN').textContent = fmt(s.voted);
      $('votedL').textContent = `${plural(s.voted, 'tip odevzdán', 'tipy odevzdány', 'tipů odevzdáno')} z ${fmt(s.joined)} připojených`;
      renderTicker(s.recent);
    }

    if (s.phase === 'closed') $('closedN').textContent = fmt(s.voted);

    if (s.phase === 'results' && s.crowdPct && !revealedResults) { revealedResults = true; revealResults(s); }
    if (s.phase === 'winners' && s.winners && !revealedWinners) { revealedWinners = true; revealWinners(s); }

    tickStatus();
  });

  function renderDots(s) {
    const n = Math.max(s.joined, 1);
    const box = $('dots').parentElement.getBoundingClientRect();
    const sc = currentScale();
    const w = box.width / sc, h = (box.height / sc) - 110;
    const cols = Math.max(8, Math.ceil(Math.sqrt(n * w / h)));
    const size = Math.min(56, (w - (cols - 1) * 10) / cols);
    $('dots').style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
    const have = $('dots').children.length;
    for (let i = have; i < s.joined; i++) $('dots').appendChild(document.createElement('i'));
    while ($('dots').children.length > s.joined) $('dots').lastChild.remove();
    [...$('dots').children].forEach((d, i) => d.classList.toggle('v', i < s.voted));
  }

  let tickerSeen = new Set();
  function renderTicker(recent) {
    const items = [...recent].reverse().slice(0, 9);
    const keys = items.map(r => r.t + '|' + r.nick + '|' + r.type);
    if (keys.join() === [...tickerSeen].join()) return;
    $('ticker').innerHTML = items.map((r, i) =>
      `<li class="${tickerSeen.has(keys[i]) ? '' : 'new'}"><b>${esc(r.nick)}</b>: ${r.type === 'vote' ? 'tip odeslán' : 've hře'}</li>`).join('');
    tickerSeen = new Set(keys);
  }

  function plural(n, one, few, many) { return n === 1 ? one : (n >= 2 && n <= 4) ? few : many; }

  const phaseLabel = { lobby: 'Připojte se', voting: 'Hlasuje se', closed: 'Konec hlasování', results: 'Výsledky sálu', winners: 'Vítězové' };
  function tickStatus() {
    if (!S) return;
    const big = $('sBig'), small = $('sSmall');
    if (S.phase === 'voting' && S.endsAt) {
      const left = Math.max(0, S.endsAt - (Date.now() + clockOffset));
      const m = Math.floor(left / 60000), sec = Math.floor(left / 1000) % 60;
      big.textContent = `${m}:${String(sec).padStart(2, '0')}`;
      big.classList.toggle('urgent', left < 30000);
      small.textContent = 'do konce hlasování';
    } else {
      big.classList.remove('urgent');
      const done = S.phase === 'closed' || S.phase === 'results' || S.phase === 'winners';
      big.textContent = fmt(done ? S.voted : S.joined);
      small.textContent = done
        ? `${plural(S.voted, 'hodnocený tip', 'hodnocené tipy', 'hodnocených tipů')}`
        : `${plural(S.joined, 'hráč', 'hráči', 'hráčů')} ve hře`;
    }
  }
  setInterval(tickStatus, 250);
  fit();
})();
</script>
</body>
</html>
