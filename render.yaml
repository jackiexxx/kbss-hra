# Volitelný Render Blueprint: vytvoří web i databázi najednou (Dashboard → New → Blueprint).
# Pokud Render u Blueprintu vyžaduje platební kartu, použij ruční postup z DEPLOY-RENDER.md.
services:
  - type: web
    name: trend-game
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: ADMIN_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: trend-game-db
          property: connectionString

databases:
  - name: trend-game-db
    plan: free
    region: frankfurt
    databaseName: trendgame
    ipAllowList: []
